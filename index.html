<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Links</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500&family=IBM+Plex+Mono&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'IBM Plex Sans Thai', sans-serif;
    background: #0f0f0f;
    color: #e8e8e2;
    min-height: 100vh;
    padding: 3rem 1.5rem;
  }

  .container {
    max-width: 580px;
    margin: 0 auto;
  }

  header {
    margin-bottom: 3rem;
    border-left: 3px solid #c8f060;
    padding-left: 1rem;
  }

  header h1 {
    font-size: 1.6rem;
    font-weight: 500;
    letter-spacing: -0.02em;
    color: #f0f0ea;
  }

  header p {
    font-size: 0.85rem;
    color: #666;
    margin-top: 0.3rem;
    font-family: 'IBM Plex Mono', monospace;
  }

  .section {
    margin-bottom: 2.5rem;
  }

  .section-label {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: #555;
    font-family: 'IBM Plex Mono', monospace;
    margin-bottom: 0.75rem;
  }

  .link-item {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 0.85rem 1rem;
    border: 0.5px solid #222;
    border-radius: 6px;
    text-decoration: none;
    color: #e8e8e2;
    margin-bottom: 0.5rem;
    transition: border-color 0.15s, background 0.15s;
    background: #161616;
  }

  .link-item:hover {
    border-color: #c8f060;
    background: #1a1f12;
    color: #c8f060;
  }

  .link-icon {
    width: 32px;
    height: 32px;
    border-radius: 4px;
    background: #222;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 14px;
  }

  .link-text {
    flex: 1;
    min-width: 0;
  }

  .link-name {
    font-size: 0.95rem;
    font-weight: 500;
  }

  .link-url {
    font-size: 0.75rem;
    color: #555;
    font-family: 'IBM Plex Mono', monospace;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .link-item:hover .link-url {
    color: #8aaa40;
  }

  .arrow {
    color: #333;
    font-size: 1.1rem;
    flex-shrink: 0;
    transition: color 0.15s, transform 0.15s;
  }

  .link-item:hover .arrow {
    color: #c8f060;
    transform: translateX(2px);
  }

  footer {
    margin-top: 4rem;
    font-size: 0.75rem;
    color: #333;
    font-family: 'IBM Plex Mono', monospace;
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <h1>My Links</h1>
    <p>last updated: 2025</p>
  </header>

  <!-- ===== แก้ตรงนี้เลยครับ: เพิ่ม/ลบ/แก้ลิ้งได้ตามใจ ===== -->

  <div class="section">
    <div class="section-label">Work</div>

    <a href="https://github.com" target="_blank" class="link-item">
      <div class="link-icon">🐙</div>
      <div class="link-text">
        <div class="link-name">GitHub</div>
        <div class="link-url">github.com</div>
      </div>
      <span class="arrow">→</span>
    </a>

    <a href="https://notion.so" target="_blank" class="link-item">
      <div class="link-icon">📝</div>
      <div class="link-text">
        <div class="link-name">Notion</div>
        <div class="link-url">notion.so</div>
      </div>
      <span class="arrow">→</span>
    </a>

  </div>

  <div class="section">
    <div class="section-label">Tools</div>

    <a href="https://claude.ai" target="_blank" class="link-item">
      <div class="link-icon">🤖</div>
      <div class="link-text">
        <div class="link-name">Claude AI</div>
        <div class="link-url">claude.ai</div>
      </div>
      <span class="arrow">→</span>
    </a>

    <a href="https://figma.com" target="_blank" class="link-item">
      <div class="link-icon">🎨</div>
      <div class="link-text">
        <div class="link-name">Figma</div>
        <div class="link-url">figma.com</div>
      </div>
      <span class="arrow">→</span>
    </a>

  </div>

  <!-- ===== จบส่วนแก้ไข ===== -->

  <footer>// แก้ไฟล์ index.html เพื่อเพิ่มลิ้ง</footer>

</div>
</body>
</html>
